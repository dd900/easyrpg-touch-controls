<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyRPG Player</title>
  <style>
    :root {
      --color-gray: hsl(0, 0%, 55%);

      --utility-group-portrait-x: 0px;
      --utility-group-portrait-y: 0px;
      --utility-group-portrait-scale: 1;
      --utility-group-landscape-x: 0px;
      --utility-group-landscape-y: 0px;
      --utility-group-landscape-scale: 1;
      --utility-group-x: var(--utility-group-portrait-x);
      --utility-group-y: var(--utility-group-portrait-y);
      --utility-group-scale: var(--utility-group-portrait-scale);
      --dpad-group-portrait-x: 0px;
      --dpad-group-portrait-y: 0px;
      --dpad-group-portrait-scale: 1;
      --dpad-group-landscape-x: 0px;
      --dpad-group-landscape-y: 0px;
      --dpad-group-landscape-scale: 1;
      --dpad-group-x: var(--dpad-group-portrait-x);
      --dpad-group-y: var(--dpad-group-portrait-y);
      --dpad-group-scale: var(--dpad-group-portrait-scale);
      --action-group-portrait-x: 0px;
      --action-group-portrait-y: 0px;
      --action-group-portrait-scale: 1;
      --action-group-landscape-x: 0px;
      --action-group-landscape-y: 0px;
      --action-group-landscape-scale: 1;
      --action-group-x: var(--action-group-portrait-x);
      --action-group-y: var(--action-group-portrait-y);
      --action-group-scale: var(--action-group-portrait-scale);
      --numpad-group-portrait-x: 0px;
      --numpad-group-portrait-y: 0px;
      --numpad-group-portrait-scale: 1;
      --numpad-group-landscape-x: 0px;
      --numpad-group-landscape-y: 0px;
      --numpad-group-landscape-scale: 1;
      --numpad-group-x: var(--numpad-group-portrait-x);
      --numpad-group-y: var(--numpad-group-portrait-y);
      --numpad-group-scale: var(--numpad-group-portrait-scale);

      --controls-size-portrait: 10vh;
      --controls-size-landscape: 20vh;
      --controls-size: var(--controls-size-portrait);
      --controls-size-min: 3.5rem;
      --controls-size-max: 6rem;
      --controls-size-landscape-min: 4rem;
      --controls-size-landscape-max: 7rem;
      --action-size: calc(var(--controls-size) * 0.82);
      --joystick-size: calc(var(--shortcut-button-width) + var(--shortcut-button-width) + max(0.18rem, calc(var(--controls-size) * 0.05)));
      --joystick-base-size: 90%;
      --joystick-knob-color: hsl(216, 32%, 25%);
      --joystick-knob-size: 46%;
      --shortcut-size-min: 2.25rem;
      --shortcut-size-max: 3rem;
      --shortcut-size: clamp(var(--shortcut-size-min), calc(var(--controls-size) * 0.43), var(--shortcut-size-max));
      --shortcut-button-width: calc(var(--shortcut-size) * 1.65);
      --shortcut-button-height: clamp(1.65rem, calc(var(--shortcut-size) * 0.75), 2rem);
      --numpad-size-min: 1.6rem;
      --numpad-size-max: 2.5rem;
      --numpad-size: clamp(var(--numpad-size-min), calc(var(--controls-size) * 0.43), var(--numpad-size-max));
      --button-rest-top: hsl(213, 24%, 43%);
      --button-rest-bottom: hsl(216, 32%, 25%);
      --button-active-top: hsl(211, 48%, 61%);
      --button-active-bottom: hsl(215, 48%, 38%);
      --button-edge: rgba(190, 216, 246, 0.46);
      --button-highlight: rgba(255, 255, 255, 0.2);
      --utility-inset: 0.5rem;
      --controls-inset: 1rem;
      --numpad-inset-right: 0.5rem;
      --joystick-inset-left: var(--utility-inset);
    }

    @supports (height: 100svh) {
      :root {
        --controls-size-portrait: clamp(var(--controls-size-min), 10svh, var(--controls-size-max));
        --controls-size-landscape: clamp(var(--controls-size-landscape-min), 20svh, var(--controls-size-landscape-max));
      }
    }

    @media (orientation: landscape) {
      :root {
        --controls-size: var(--controls-size-landscape);
        --utility-inset: 0.25rem;
        --utility-group-x: var(--utility-group-landscape-x);
        --utility-group-y: var(--utility-group-landscape-y);
        --utility-group-scale: var(--utility-group-landscape-scale);
        --dpad-group-x: var(--dpad-group-landscape-x);
        --dpad-group-y: var(--dpad-group-landscape-y);
        --dpad-group-scale: var(--dpad-group-landscape-scale);
        --action-group-x: var(--action-group-landscape-x);
        --action-group-y: var(--action-group-landscape-y);
        --action-group-scale: var(--action-group-landscape-scale);
        --numpad-group-x: var(--numpad-group-landscape-x);
        --numpad-group-y: var(--numpad-group-landscape-y);
        --numpad-group-scale: var(--numpad-group-landscape-scale);
      }
    }

    html {
      touch-action: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      margin: 0;
      color: white;
      background: black;
    }

    .unselectable,
    #controls,
    #dpad,
    #apad,
    #shortcut-pad,
    #numpad-wrap,
    #numpad-panel,
    #viewport {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #status {
      font-size: 1.5rem;
      color: var(--color-gray);
      text-align: center;
    }

    #utility-group {
      position: fixed;
      top: 0.5rem;
      left: var(--utility-inset);
      transform: translate(var(--utility-group-x), var(--utility-group-y)) scale(var(--utility-group-scale));
      transform-origin: top left;
      z-index: 30;
    }

    #controls {
      position: absolute;
      top: 0;
      left: 0;
      text-align: left;
    }

    #controls button {
      -webkit-appearance: button;
      appearance: button;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, var(--button-rest-top), var(--button-rest-bottom));
      border: 1px solid var(--button-edge);
      border-radius: 0.5rem;
      color: white;
      font-family: inherit;
      font-size: 1em;
      line-height: inherit;
      cursor: pointer;
      padding: 0.25rem;
      touch-action: none;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.42), inset 0 1px 0 var(--button-highlight);
    }

    #controls svg {
      pointer-events: none;
    }

    #canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      border: 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      transform: translate(-50%, -50%);
    }

    img#canvas {
      object-fit: contain;
    }

    #dpad,
    #apad,
    #shortcut-pad,
    #numpad-wrap {
      position: fixed;
      z-index: 20;
      touch-action: none;
    }
    
    #dpad {
      left: var(--joystick-inset-left);
      bottom: var(--controls-inset);
      width: var(--joystick-size);
      height: var(--joystick-size);
      transform: translate(var(--dpad-group-x), var(--dpad-group-y)) scale(var(--dpad-group-scale));
      transform-origin: bottom left;
      border-radius: 50%;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #dpad .joystick-base {
      position: absolute;
      inset: calc((100% - var(--joystick-base-size)) / 2);
      box-sizing: border-box;
      border: 2px solid rgba(255, 255, 255, 0.22);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, rgba(255,255,255,0.16), rgba(128,128,128,0.24) 46%, rgba(0,0,0,0.48) 100%);
      box-shadow: inset 0 3px 10px rgba(0,0,0,0.5), 0 3px 10px rgba(0,0,0,0.28);
      pointer-events: none;
    }

    #dpad .joystick-base::before {
      content: "";
      position: absolute;
      inset: 12%;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 50%;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.18);
    }

    #dpad.cross-mode .joystick-base,
    #dpad.cross-mode #joystick-knob {
      display: none;
    }

    #dpad-cross {
      position: absolute;
      inset: calc((100% - var(--joystick-base-size)) / 2);
      display: none;
      pointer-events: none;
    }

    #dpad.cross-mode #dpad-cross {
      display: grid;
    }

    .dpad-direction {
      position: absolute;
      box-sizing: border-box;
      border: 1px solid var(--button-edge);
      background: linear-gradient(145deg, var(--button-rest-top), var(--button-rest-bottom));
      box-shadow: 0 4px 9px rgba(0, 0, 0, 0.42), inset 0 1px 0 var(--button-highlight), inset 0 -2px 3px rgba(0, 0, 0, 0.2);
    }

    .dpad-direction.active {
      background: linear-gradient(145deg, var(--button-active-top), var(--button-active-bottom));
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.38), 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    #dpad-up {
      top: 0;
      left: 33%;
      width: 34%;
      height: 45%;
      clip-path: polygon(18% 0, 82% 0, 94% 7%, 100% 18%, 100% 62%, 50% 100%, 0 62%, 0 18%, 6% 7%);
    }

    #dpad-left {
      top: 33%;
      left: 0;
      width: 45%;
      height: 34%;
      clip-path: polygon(0 18%, 6% 7%, 18% 0, 62% 0, 100% 50%, 62% 100%, 18% 100%, 6% 93%, 0 82%);
    }

    #dpad-right {
      top: 33%;
      right: 0;
      width: 45%;
      height: 34%;
      clip-path: polygon(38% 0, 82% 0, 94% 7%, 100% 18%, 100% 82%, 94% 93%, 82% 100%, 38% 100%, 0 50%);
    }

    #dpad-down {
      bottom: 0;
      left: 33%;
      width: 34%;
      height: 45%;
      clip-path: polygon(50% 0, 100% 38%, 100% 82%, 94% 93%, 82% 100%, 18% 100%, 6% 93%, 0 82%, 0 38%);
    }

    #joystick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--joystick-knob-size);
      height: var(--joystick-knob-size);
      box-sizing: border-box;
      border: 2px solid rgba(255,255,255,0.28);
      border-radius: 50%;
      background: radial-gradient(circle at 32% 24%, hsl(0,0%,76%), hsl(0,0%,49%) 48%, hsl(0,0%,27%) 100%);
      box-shadow: 0 4px 8px rgba(0,0,0,0.58), inset 0 1px 2px rgba(255,255,255,0.36);
      transform: translate(-50%, -50%);
      transition: box-shadow 80ms ease-out;
      pointer-events: none;
    }

    @supports (background: color-mix(in srgb, red, blue)) {
      #joystick-knob {
        background: radial-gradient(circle at 32% 24%, color-mix(in srgb, var(--joystick-knob-color) 45%, white), var(--joystick-knob-color) 48%, color-mix(in srgb, var(--joystick-knob-color) 55%, black) 100%);
      }
    }

    #joystick-knob.active {
      box-shadow: 0 4px 9px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.4), 0 0 0 2px rgba(255,255,255,0.10);
    }
    
    #apad {
      right: var(--controls-inset);
      bottom: var(--controls-inset);
      transform: translate(var(--action-group-x), var(--action-group-y)) scale(var(--action-group-scale));
      transform-origin: bottom right;
      display: grid;
      grid-template-columns: repeat(2, var(--action-size));
      grid-template-rows: repeat(2, var(--action-size));
      gap: max(0.25rem, calc(var(--controls-size) * 0.07));
      justify-items: center;
      align-items: center;
    }

    .control-button {
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 0;
      border: 1px solid var(--button-edge);
      background: linear-gradient(145deg, var(--button-rest-top), var(--button-rest-bottom));
      color: white;
      font-family: inherit;
      font-weight: bold;
      line-height: 1;
      text-align: center;
      -webkit-appearance: none;
      appearance: none;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      box-shadow: 0 4px 9px rgba(0, 0, 0, 0.42), inset 0 1px 0 var(--button-highlight), inset 0 -2px 3px rgba(0, 0, 0, 0.2);
      transition: transform 70ms ease-out, filter 100ms ease-out;
    }

    .control-button:focus-visible,
    #controls-fullscreen:focus-visible {
      outline: 2px solid white;
      outline-offset: 3px;
    }

    #apad > .control-button {
      width: var(--action-size);
      height: var(--action-size);
      border-radius: 50%;
      font-size: 0.7rem;
    }

    #apad-shift {
      grid-column: 1;
      grid-row: 1;
    }

    #apad-escape {
      grid-column: 2;
      grid-row: 1;
    }

    #apad-enter {
      grid-column: 1 / span 2;
      grid-row: 2;
      justify-self: center;
      font-size: 1rem;
    }
    
    #shortcut-pad {
      position: absolute;
      left: 0;
      top: calc(var(--controls-inset) + 1.5rem);
      bottom: auto;
      display: grid;
      grid-template-columns: repeat(2, var(--shortcut-button-width));
      grid-auto-rows: var(--shortcut-button-height);
      column-gap: max(0.18rem, calc(var(--controls-size) * 0.05));
      row-gap: max(0.35rem, calc(max(0.18rem, calc(var(--controls-size) * 0.05)) * 1.5));
    }

    #shortcut-pad .control-button {
      width: var(--shortcut-button-width);
      height: var(--shortcut-button-height);
      border-radius: 0.45rem;
      font-size: 0.68rem;
    }

    #dpad-mode-toggle {
      grid-column: 1 / -1;
      width: 100%;
      height: var(--shortcut-button-height);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      border-radius: 0.45rem;
      font-size: 0.68rem;
    }

    .dpad-mode-icon {
      position: relative;
      width: 1rem;
      height: 1rem;
      flex: none;
    }

    .dpad-mode-icon::before,
    .dpad-mode-icon::after {
      content: "";
      position: absolute;
      border-radius: 2px;
      background: currentColor;
    }

    .dpad-mode-icon::before {
      left: 36%;
      top: 0;
      width: 28%;
      height: 100%;
    }

    .dpad-mode-icon::after {
      left: 0;
      top: 36%;
      width: 100%;
      height: 28%;
    }
    
    #numpad-wrap {
      position: fixed;
      top: var(--controls-inset);
      right: var(--numpad-inset-right);
      transform: translate(var(--numpad-group-x), var(--numpad-group-y)) scale(var(--numpad-group-scale));
      transform-origin: top right;
      z-index: 20;
    }

    #numpad-toggle {
      width: calc((4 * var(--numpad-size)) + (3 * max(0.18rem, calc(var(--controls-size) * 0.05))));
      min-height: 1.75rem;
      height: calc(var(--numpad-size) * 0.75);
      padding: 0 0.25rem;
      border-radius: 0.45rem;
      font-size: 0.65rem;
    }

    #numpad-panel {
      position: absolute;
      top: calc(100% + max(0.18rem, calc(var(--controls-size) * 0.05)));
      right: 0;
      display: none;
      grid-template-columns: repeat(4, var(--numpad-size));
      grid-template-rows: repeat(4, var(--numpad-size));
      gap: max(0.18rem, calc(var(--controls-size) * 0.05));
      touch-action: none;
    }

    #numpad-wrap.open #numpad-panel {
      display: grid;
    }

    #numpad-panel .control-button {
      width: var(--numpad-size);
      height: var(--numpad-size);
      border-radius: 0.4rem;
      font-size: 0.72rem;
    }

    #apad > .control-button:not(.active),
    #shortcut-pad .control-button:not(.active),
    #numpad-panel .control-button:not(.active) {
      background: linear-gradient(145deg, var(--button-rest-top), var(--button-rest-bottom));
    }

    .control-button.active {
      opacity: 1 !important;
      transform: scale(0.94);
      background: linear-gradient(145deg, var(--button-active-top), var(--button-active-bottom));
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.38), 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    @media (orientation: portrait) {
      #shortcut-pad {
        left: 0;
      }
    }

    @media (orientation: landscape) {
      #shortcut-pad {
        top: calc(var(--controls-inset) + 2.25rem);
        bottom: auto;
      }

    }
  </style>
</head>
<body>
  <div id="status"></div>

  <div id="viewport">
    <div id="utility-group" class="unselectable" role="group" aria-label="Utility controls">
      <div id="controls">
        <button id="controls-fullscreen" class="unselectable" type="button" aria-label="Fullscreen">
          <svg viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg" width="25" height="25"><path d="M13.5 13.5H10m3.5 0V10m0 3.5l-4-4m.5-8h3.5m0 0V5m0-3.5l-4 4M5 1.5H1.5m0 0V5m0-3.5l4 4m-4 4.5v3.5m0 0H5m-3.5 0l4-4" stroke="currentColor"></path></svg>
        </button>
      </div>
      <div id="shortcut-pad" class="unselectable" role="group" aria-label="Shortcut keys">
        <button id="shortcut-f1" class="control-button" type="button" data-key="F1" aria-label="F1" aria-pressed="false">F1</button>
        <button id="shortcut-f12" class="control-button" type="button" data-key="F12" aria-label="F12" aria-pressed="false">F12</button>
        <button id="shortcut-f" class="control-button" type="button" data-key="KeyF" aria-label="F" aria-pressed="false">F</button>
        <button id="shortcut-g" class="control-button" type="button" data-key="KeyG" aria-label="G" aria-pressed="false">G</button>
        <button id="dpad-mode-toggle" class="control-button" type="button" aria-label="D-pad mode" aria-pressed="false">
          <span class="dpad-mode-icon" aria-hidden="true"></span>
          <span>D-PAD</span>
        </button>
      </div>
    </div>
    <canvas id="canvas" tabindex="-1" class="unselectable"></canvas>

    <div id="dpad" class="unselectable" role="group" aria-label="Virtual joystick">
      <div class="joystick-base" aria-hidden="true">
        <div id="joystick-knob" aria-hidden="true"></div>
      </div>
      <div id="dpad-cross" aria-hidden="true">
        <span id="dpad-up" class="dpad-direction"></span>
        <span id="dpad-left" class="dpad-direction"></span>
        <span id="dpad-right" class="dpad-direction"></span>
        <span id="dpad-down" class="dpad-direction"></span>
      </div>
    </div>

    <div id="numpad-wrap" class="unselectable">
      <button id="numpad-toggle" class="control-button" type="button" aria-expanded="false" aria-controls="numpad-panel">NUM +</button>
      <div id="numpad-panel" class="unselectable" role="group" aria-label="Numpad keys">
      <button class="control-button" type="button" data-key="Numpad7" aria-label="Numpad 7" aria-pressed="false">7</button>
      <button class="control-button" type="button" data-key="Numpad8" aria-label="Numpad 8" aria-pressed="false">8</button>
      <button class="control-button" type="button" data-key="Numpad9" aria-label="Numpad 9" aria-pressed="false">9</button>
      <button class="control-button" type="button" data-key="NumpadDivide" aria-label="Numpad divide" aria-pressed="false">÷</button>
      <button class="control-button" type="button" data-key="Numpad4" aria-label="Numpad 4" aria-pressed="false">4</button>
      <button class="control-button" type="button" data-key="Numpad5" aria-label="Numpad 5" aria-pressed="false">5</button>
      <button class="control-button" type="button" data-key="Numpad6" aria-label="Numpad 6" aria-pressed="false">6</button>
      <button class="control-button" type="button" data-key="NumpadMultiply" aria-label="Numpad multiply" aria-pressed="false">×</button>
      <button class="control-button" type="button" data-key="Numpad1" aria-label="Numpad 1" aria-pressed="false">1</button>
      <button class="control-button" type="button" data-key="Numpad2" aria-label="Numpad 2" aria-pressed="false">2</button>
      <button class="control-button" type="button" data-key="Numpad3" aria-label="Numpad 3" aria-pressed="false">3</button>
      <button class="control-button" type="button" data-key="NumpadSubtract" aria-label="Numpad subtract" aria-pressed="false">−</button>
      <button class="control-button" type="button" data-key="Numpad0" aria-label="Numpad 0" aria-pressed="false">0</button>
      <button class="control-button" type="button" data-key="NumpadDecimal" aria-label="Numpad decimal" aria-pressed="false">.</button>
      <button class="control-button" type="button" data-key="NumpadEnter" aria-label="Numpad enter" aria-pressed="false">↵</button>
      <button class="control-button" type="button" data-key="NumpadAdd" aria-label="Numpad add" aria-pressed="false">+</button>
      </div>
    </div>

    <div id="apad" class="unselectable" role="group" aria-label="Action keys">
      <button id="apad-shift" class="control-button" type="button" data-key="ShiftLeft" aria-label="Shift" aria-pressed="false">SHIFT</button>
      <button id="apad-escape" class="control-button" type="button" data-key="Escape" aria-label="Escape" aria-pressed="false">ESC</button>
      <button id="apad-enter" class="control-button" type="button" data-key="Enter" aria-label="Enter" aria-pressed="false">⏎</button>
    </div>
  </div>

<script async type="text/javascript" src="index.js"></script>

<script>
const hasTouchscreen = window.matchMedia('(hover: none), (pointer: coarse)').matches;
const preventNativeKeys = ['ArrowUp', 'ArrowDown', 'ArrowRight', 'ArrowLeft', ' ', 'F12'];
const canvas = document.getElementById('canvas');
const keyboardEventData = {
  ArrowUp: ['ArrowUp', 38],
  ArrowDown: ['ArrowDown', 40],
  ArrowRight: ['ArrowRight', 39],
  ArrowLeft: ['ArrowLeft', 37],
  Enter: ['Enter', 13],
  Escape: ['Escape', 27],
  ShiftLeft: ['Shift', 16],
  F1: ['F1', 112],
  F12: ['F12', 123],
  KeyF: ['f', 70],
  KeyG: ['g', 71],
  Numpad7: ['7', 103, 3],
  Numpad8: ['8', 104, 3],
  Numpad9: ['9', 105, 3],
  NumpadDivide: ['/', 111, 3],
  Numpad4: ['4', 100, 3],
  Numpad5: ['5', 101, 3],
  Numpad6: ['6', 102, 3],
  NumpadMultiply: ['*', 106, 3],
  Numpad1: ['1', 97, 3],
  Numpad2: ['2', 98, 3],
  Numpad3: ['3', 99, 3],
  NumpadSubtract: ['-', 109, 3],
  Numpad0: ['0', 96, 3],
  NumpadDecimal: ['.', 110, 3],
  NumpadEnter: ['Enter', 13, 3],
  NumpadAdd: ['+', 107, 3]
};
const heldKeys = new Map();
const activeTouches = new Map();
const activeNodeCounts = new Map();
let easyrpgPlayer;
let activeDpadTouchId = null;

// Launch the Player and configure it.
window.addEventListener('load', () => {
  createEasyRpgPlayer({
    game: undefined,
    saveFs: undefined
  }).then(Module => {
    easyrpgPlayer = Module;
    easyrpgPlayer.initApi();
    canvas.focus();
  });
});

// Make EasyRPG player embeddable.
canvas.addEventListener('mouseenter', () => canvas.focus());
canvas.addEventListener('click', () => canvas.focus());

// Show or hide the numpad without moving the other controls.
const numpadWrap = document.getElementById('numpad-wrap');
const numpadToggle = document.getElementById('numpad-toggle');
numpadToggle.addEventListener('click', () => {
  const isOpen = numpadWrap.classList.toggle('open');
  numpadToggle.textContent = isOpen ? 'NUM −' : 'NUM +';
  numpadToggle.setAttribute('aria-expanded', String(isOpen));
});

// Toggle fullscreen where the browser supports the Fullscreen API.
const viewport = document.getElementById('viewport');
const fullscreenButton = document.getElementById('controls-fullscreen');

function updateFullscreenButton() {
  const isFullscreen = document.fullscreenElement === viewport;
  fullscreenButton.setAttribute('aria-label', isFullscreen ? 'Exit fullscreen' : 'Enter fullscreen');
  fullscreenButton.setAttribute('aria-pressed', String(isFullscreen));
  fullscreenButton.title = isFullscreen ? 'Exit fullscreen' : 'Enter fullscreen';
}

fullscreenButton.addEventListener('click', async () => {
  try {
    if (document.fullscreenElement === viewport) {
      await document.exitFullscreen();
    } else if (viewport.requestFullscreen) {
      await viewport.requestFullscreen();
    }
    updateFullscreenButton();
  } catch (error) {
    console.warn('Fullscreen change was rejected by the browser.', error);
  }
});

document.addEventListener('fullscreenchange', updateFullscreenButton);
updateFullscreenButton();

/** Simulate a keyboard event on the emscripten canvas. */
function simulateKeyboardEvent(eventType, code) {
  const [key, keyCode, location = 0] = keyboardEventData[code];
  const event = new KeyboardEvent(eventType, {
    bubbles: true,
    code,
    key,
    keyCode,
    which: keyCode,
    location
  });
  canvas.dispatchEvent(event);
}

function pressKey(code) {
  const count = heldKeys.get(code) || 0;
  if (count === 0) {
    simulateKeyboardEvent('keydown', code);
  }
  heldKeys.set(code, count + 1);
}

function releaseKey(code) {
  const count = heldKeys.get(code) || 0;
  if (count <= 1) {
    if (count === 1) {
      simulateKeyboardEvent('keyup', code);
    }
    heldKeys.delete(code);
  } else {
    heldKeys.set(code, count - 1);
  }
}

function activateNode(node) {
  if (!node) return;
  const count = activeNodeCounts.get(node) || 0;
  activeNodeCounts.set(node, count + 1);
  node.classList.add('active');
  node.setAttribute('aria-pressed', 'true');
}

function deactivateNode(node) {
  if (!node) return;
  const count = activeNodeCounts.get(node) || 0;
  if (count <= 1) {
    activeNodeCounts.delete(node);
    node.classList.remove('active');
    node.setAttribute('aria-pressed', 'false');
  } else {
    activeNodeCounts.set(node, count - 1);
  }
}

/**
 * Set the keys and visual elements currently held by a touch.
 * Shared key counts prevent one finger releasing a key still held by another.
 */
function setTouchState(touchId, codes, nodes = [], isDpad = false) {
  const previous = activeTouches.get(touchId);
  const oldCodes = new Set(previous ? previous.codes : []);
  const newCodes = new Set(codes);
  const oldNodes = new Set(previous ? previous.nodes : []);
  const newNodes = new Set(nodes);

  for (const code of oldCodes) {
    if (!newCodes.has(code)) releaseKey(code);
  }
  for (const code of newCodes) {
    if (!oldCodes.has(code)) pressKey(code);
  }
  for (const node of oldNodes) {
    if (!newNodes.has(node)) deactivateNode(node);
  }
  for (const node of newNodes) {
    if (!oldNodes.has(node)) activateNode(node);
  }

  activeTouches.set(touchId, {
    codes: [...newCodes],
    nodes: [...newNodes],
    isDpad
  });
}

function releaseTouch(touchId) {
  if (!activeTouches.has(touchId)) return;

  const state = activeTouches.get(touchId);
  setTouchState(touchId, [], [], false);
  activeTouches.delete(touchId);

  if (state.isDpad && touchId === activeDpadTouchId) {
    activeDpadTouchId = null;
    resetJoystickKnob();
  }
}

const dpad = document.getElementById('dpad');
const joystickKnob = document.getElementById('joystick-knob');
const dpadModeToggle = document.getElementById('dpad-mode-toggle');
const dpadDirectionNodes = {
  ArrowUp: document.getElementById('dpad-up'),
  ArrowDown: document.getElementById('dpad-down'),
  ArrowLeft: document.getElementById('dpad-left'),
  ArrowRight: document.getElementById('dpad-right')
};

function toggleDpadMode() {
  const useCrossDpad = dpad.classList.toggle('cross-mode');
  dpadModeToggle.classList.toggle('active', useCrossDpad);
  dpadModeToggle.setAttribute('aria-pressed', String(useCrossDpad));
  if (activeDpadTouchId !== null) releaseTouch(activeDpadTouchId);
}

dpadModeToggle.addEventListener('pointerdown', event => {
  if (event.button !== 0) return;
  if (event.pointerType === 'touch') event.preventDefault();
  toggleDpadMode();
});

dpadModeToggle.addEventListener('click', event => {
  if (event.detail !== 0) return;
  toggleDpadMode();
});

const dpadDirections = {
  0: { codes: ['ArrowRight'] },
  1: { codes: ['ArrowDown', 'ArrowRight'] },
  2: { codes: ['ArrowDown'] },
  3: { codes: ['ArrowDown', 'ArrowLeft'] },
  4: { codes: ['ArrowLeft'] },
  5: { codes: ['ArrowUp', 'ArrowLeft'] },
  6: { codes: ['ArrowUp'] },
  7: { codes: ['ArrowUp', 'ArrowRight'] }
};

function resetJoystickKnob() {
  joystickKnob.style.transform = 'translate(-50%, -50%)';
}

function updateDpadTouch(touchId, clientX, clientY) {
  const rect = dpad.getBoundingClientRect();
  const dx = (clientX - (rect.left + rect.width / 2)) / (rect.width / 2);
  const dy = (clientY - (rect.top + rect.height / 2)) / (rect.height / 2);
  const distance = Math.hypot(dx, dy);
  const deadZone = 0.20;

  // Keep the knob near the center when the finger is inside the dead zone.
  if (distance < deadZone) {
    resetJoystickKnob();
    setTouchState(touchId, [], [], true);
    return;
  }

  const travel = Math.min(distance, 1);
  const offsetX = (dx / distance) * rect.width * 0.23 * travel;
  const offsetY = (dy / distance) * rect.height * 0.23 * travel;

  joystickKnob.style.transform =
    `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;

  const angle = Math.atan2(dy, dx);
  const octant = (Math.round(angle / (Math.PI / 4)) + 8) % 8;
  const codes = dpadDirections[octant].codes;
  const activeNodes = dpad.classList.contains('cross-mode')
    ? codes.map(code => dpadDirectionNodes[code])
    : [joystickKnob];

  setTouchState(touchId, codes, activeNodes, true);
}

// Suppress the browser's native long-press response on game controls.
document.addEventListener('touchstart', event => {
  if (event.target instanceof Element && event.target.closest('#dpad, [data-key], #dpad-mode-toggle')) {
    event.preventDefault();
  }
}, { passive: false });

// Handle one pointer on the joystick at a time.
dpad.addEventListener('pointerdown', event => {
  if (event.button !== 0 || activeDpadTouchId !== null) return;
  event.preventDefault();
  activeDpadTouchId = event.pointerId;
  dpad.setPointerCapture(event.pointerId);
  updateDpadTouch(event.pointerId, event.clientX, event.clientY);
});

// Bind controls to pointer input and support non-pointer button activation.
for (const node of document.querySelectorAll('[data-key]')) {
  if (node.closest('#dpad')) continue;

  node.addEventListener('pointerdown', event => {
    if (event.button !== 0) return;
    event.preventDefault();
    node.setPointerCapture(event.pointerId);
    setTouchState(event.pointerId, [node.dataset.key], [node], false);
  });

  node.addEventListener('click', event => {
    if (event.detail !== 0) return;
    const code = node.dataset.key;
    pressKey(code);
    activateNode(node);
    window.setTimeout(() => {
      releaseKey(code);
      deactivateNode(node);
    }, 100);
  });
}

// Track captured pointers when they move between controls or outside them.
document.addEventListener('pointermove', event => {
  const state = activeTouches.get(event.pointerId);

  if (state && state.isDpad && event.pointerId === activeDpadTouchId) {
    event.preventDefault();
    updateDpadTouch(event.pointerId, event.clientX, event.clientY);
  } else if (state) {
    event.preventDefault();
    const target = document.elementFromPoint(event.clientX, event.clientY);
    const control = target instanceof Element ? target.closest('[data-key]') : null;

    if (control && !control.closest('#dpad')) {
      setTouchState(event.pointerId, [control.dataset.key], [control], false);
    } else {
      setTouchState(event.pointerId, [], [], false);
    }
  }
});

document.addEventListener('pointerup', event => releaseTouch(event.pointerId));
document.addEventListener('pointercancel', event => releaseTouch(event.pointerId));
document.addEventListener('lostpointercapture', event => releaseTouch(event.pointerId));

function releaseAllTouches() {
  for (const touchId of [...activeTouches.keys()]) {
    releaseTouch(touchId);
  }
}

window.addEventListener('blur', releaseAllTouches);
window.addEventListener('pagehide', releaseAllTouches);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) releaseAllTouches();
});

// Stop the browser's press-and-hold context menu on the on-screen controls.
document.addEventListener('contextmenu', event => {
  if (event.target.closest('#controls, #dpad, #apad, #shortcut-pad, #numpad-wrap, #viewport')) {
    event.preventDefault();
  }
});

/** @type {{[key: number]: Gamepad}} */
let gamepads = {};
const haveEvents = 'ongamepadconnected' in window;

function addGamepad(gamepad) {
  if (gamepad == undefined) return;
  gamepads[gamepad.index] = gamepad;
  updateTouchControlsVisibility();
}

function removeGamepad(gamepad) {
  if (gamepad == undefined) return;
  delete gamepads[gamepad.index];
  updateTouchControlsVisibility();
}

function getGamepads() {
  return navigator.getGamepads
    ? navigator.getGamepads()
    : (navigator.webkitGetGamepads ? navigator.webkitGetGamepads() : []);
}

function scanGamePads() {
  const pads = getGamepads();
  const connectedGamepads = new Map();
  for (let i = 0; i < pads.length; i++) {
    if (pads[i]) {
      connectedGamepads.set(pads[i].index, pads[i]);
    }
  }

  let changed = false;
  for (const index of Object.keys(gamepads)) {
    if (!connectedGamepads.has(Number(index))) {
      delete gamepads[index];
      changed = true;
    }
  }
  for (const [index, gamepad] of connectedGamepads) {
    if (!(index in gamepads)) changed = true;
    gamepads[index] = gamepad;
  }
  if (changed) updateTouchControlsVisibility();
}

if (!haveEvents) {
  setInterval(scanGamePads, 500);
}

window.addEventListener('gamepadconnected', event => addGamepad(event.gamepad));
window.addEventListener('gamepaddisconnected', event => removeGamepad(event.gamepad));
scanGamePads();

function updateTouchControlsVisibility() {
  const controls = document.querySelectorAll('#controls, #dpad, #apad, #shortcut-pad, #numpad-wrap');
  if (hasTouchscreen && Object.keys(gamepads).length === 0) {
    for (const element of controls) element.style.display = '';
  } else {
    for (const element of controls) element.style.display = 'none';
  }
}

if (!hasTouchscreen) {
  // Prevent scrolling when pressing specific keys on a physical keyboard.
  window.addEventListener('keydown', event => {
    if (preventNativeKeys.includes(event.key)) event.preventDefault();
  });

  canvas.addEventListener('contextmenu', event => event.preventDefault());
}

updateTouchControlsVisibility();
</script>
